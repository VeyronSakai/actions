name: Read LFS config
description: Read .lfsconfig from GitHub and extract lfs.url

inputs:
  github-token:
    description: GitHub token for gh api
    required: true
  lfs-username:
    description: Username for the Git LFS endpoint. Give it together with lfs-password to build lfs-endpoint.
    required: false
  lfs-password:
    description: Password for the Git LFS endpoint. Give it together with lfs-username.
    required: false

outputs:
  lfs-url:
    description: LFS endpoint URL from .lfsconfig
    value: ${{ steps.read-lfs-config.outputs.lfs-url }}
  lfs-endpoint:
    description: lfs-url with the credentials embedded when lfs-username and lfs-password are given, otherwise the same as lfs-url
    value: ${{ steps.read-lfs-config.outputs.lfs-endpoint }}

runs:
  using: composite
  steps:
    - name: Read LFS config
      id: read-lfs-config
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        LFS_USERNAME: ${{ inputs.lfs-username }}
        LFS_PASSWORD: ${{ inputs.lfs-password }}
      run: |
        # gh exits non-zero when .lfsconfig is absent. That is not a failure: such a repository simply uses
        # the default, GitHub-hosted LFS endpoint, so report empty outputs and let the caller carry on.
        $PSNativeCommandUseErrorActionPreference = $false
        $errorFile = (New-TemporaryFile).FullName
        $content = gh api "repos/$env:GITHUB_REPOSITORY/contents/.lfsconfig?ref=$env:GITHUB_SHA" --jq .content 2> $errorFile
        $exitCode = $LASTEXITCODE
        $global:LASTEXITCODE = 0
        $stderr = (Get-Content -LiteralPath $errorFile -Raw) ?? ""
        Remove-Item -LiteralPath $errorFile -Force

        if ($exitCode -ne 0) {
          # Only a missing file means "no custom endpoint". A revoked token, a rate limit or a network error
          # must not be mistaken for it, or the job would silently fetch from the wrong endpoint.
          if ($stderr -notmatch '\(HTTP 404\)') {
            throw "Failed to read .lfsconfig: $stderr"
          }

          Write-Output "::notice::.lfsconfig was not found. Using the repository's default Git LFS endpoint."
          "lfs-url=" >> $env:GITHUB_OUTPUT
          "lfs-endpoint=" >> $env:GITHUB_OUTPUT
          exit 0
        }

        # GitHub's Contents API may wrap base64 content with line breaks, so strip all whitespace before decoding.
        $lfsConfig = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String(($content -replace '\s', '')))

        # (?m) enables multi-line mode, then this pattern finds the `url = ...` line while tolerating surrounding spaces and captures only the URL value.
        $match = [regex]::Match($lfsConfig, '(?m)^\s*url\s*=\s*(.+?)\s*$')
        if (-not $match.Success) {
          throw "lfs.url was not found in .lfsconfig."
        }
        $lfsUrl = $match.Groups[1].Value

        # Without credentials the endpoint is the URL as written, which is what an endpoint that needs no
        # authentication (or carries its own credentials in .lfsconfig) expects.
        $endpoint = $lfsUrl

        if ($env:LFS_USERNAME -or $env:LFS_PASSWORD) {
          if (-not ($env:LFS_USERNAME -and $env:LFS_PASSWORD)) {
            throw "lfs-username and lfs-password must be given together."
          }

          $uri = [uri]$lfsUrl
          if ($uri.UserInfo) {
            throw "lfs.url in .lfsconfig already carries credentials. Remove them from .lfsconfig before passing lfs-username and lfs-password."
          }

          # Percent-encode so that a credential containing : / @ or # cannot break the URL apart.
          $userInfo = "{0}:{1}" -f [uri]::EscapeDataString($env:LFS_USERNAME), [uri]::EscapeDataString($env:LFS_PASSWORD)
          $endpoint = "{0}://{1}@{2}{3}" -f $uri.Scheme, $userInfo, $uri.Authority, $uri.PathAndQuery

          # Percent-encoding can make the credential differ from the registered secret, which is matched
          # literally, so mask the assembled URL as well.
          Write-Output "::add-mask::$endpoint"
        }

        "lfs-url=$lfsUrl" >> $env:GITHUB_OUTPUT
        "lfs-endpoint=$endpoint" >> $env:GITHUB_OUTPUT
