name: Distribute to Firebase App Distribution
description: Upload an app binary to Firebase App Distribution using the standalone Firebase CLI.

inputs:
  binary-path:
    description: Path to the binary to upload (.ipa / .apk / .aab).
    required: true
  app-id:
    description: Firebase App ID (e.g. 1:1234567890:ios:abcdef).
    required: true
  workload-identity-provider:
    description: "Workload Identity Provider resource name (projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>). The calling job needs permissions: id-token: write."
    required: true
  service-account:
    description: Service account to impersonate, holding the Firebase App Distribution Admin role.
    required: true
  testers:
    description: Comma-separated tester emails. Unregistered addresses are added and invited automatically.
    required: false
    default: ""
  groups:
    description: Comma-separated tester group aliases.
    required: false
    default: ""
  release-notes:
    description: Release notes shown to testers.
    required: false
    default: ""
  firebase-tools-version:
    description: Firebase CLI version to use, as accepted by firebase.tools (e.g. latest, v14.0.0).
    required: false
    default: "latest"

runs:
  using: composite
  steps:
    # Exports GOOGLE_APPLICATION_CREDENTIALS for the following step and removes
    # the credentials file in its post step.
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}

    - name: Distribute to Firebase App Distribution
      shell: pwsh
      env:
        BINARY_PATH: ${{ inputs.binary-path }}
        APP_ID: ${{ inputs.app-id }}
        TESTERS: ${{ inputs.testers }}
        GROUPS: ${{ inputs.groups }}
        RELEASE_NOTES: ${{ inputs.release-notes }}
        FIREBASE_TOOLS_VERSION: ${{ inputs.firebase-tools-version }}
      run: |
        if (-not (Test-Path -LiteralPath $env:BINARY_PATH)) {
          throw "Binary not found at $env:BINARY_PATH"
        }

        # Standalone Firebase CLI (no Node required). Cache it under RUNNER_TOOL_CACHE per version.
        $platform = if ($IsWindows) { "win" } elseif ($IsLinux) { "linux" } else { "macos" }
        $exe = if ($IsWindows) { "firebase.exe" } else { "firebase" }
        $firebaseBin = Join-Path $env:RUNNER_TOOL_CACHE "firebase/$env:FIREBASE_TOOLS_VERSION/$exe"
        if (-not (Test-Path -LiteralPath $firebaseBin)) {
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $firebaseBin) | Out-Null
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri "https://firebase.tools/bin/$platform/$env:FIREBASE_TOOLS_VERSION" -OutFile $firebaseBin
          if (-not $IsWindows) { chmod +x $firebaseBin }
        }

        $distributeArgs = @($env:BINARY_PATH, "--app", $env:APP_ID)
        if ($env:RELEASE_NOTES) { $distributeArgs += "--release-notes", $env:RELEASE_NOTES }
        if ($env:TESTERS) { $distributeArgs += "--testers", $env:TESTERS }
        if ($env:GROUPS) { $distributeArgs += "--groups", $env:GROUPS }

        # With no testers and no groups the CLI still exits 0, so the release is created but reaches nobody.
        if (-not $env:TESTERS -and -not $env:GROUPS) {
          Write-Host "::warning::Neither testers nor groups were given. The release will be created but distributed to nobody."
        }

        & $firebaseBin appdistribution:distribute @distributeArgs
        if ($LASTEXITCODE -ne 0) {
          throw "firebase appdistribution:distribute failed with exit code $LASTEXITCODE"
        }
